name: CI Pipeline - Bodaboda App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Start app for testing
        run: |
          php -S localhost:80 -t app/ &
          sleep 3

      - name: Run tests
        run: php tests/test_app.php

      - name: Build Docker image
        run: docker build -t bodaboda-app:latest .

      - name: Tag Docker image
        run: docker tag bodaboda-app:latest bodaboda-app:v1